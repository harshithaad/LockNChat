name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locknchat
          POSTGRES_PASSWORD: locknchat
          POSTGRES_DB: locknchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locknchat -d locknchat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://locknchat:locknchat@localhost:5432/locknchat_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

      - name: Server tests
        run: npm test
        working-directory: server

      - name: Client tests
        run: npm test
        working-directory: client
